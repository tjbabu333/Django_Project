services:

  web:
    build: .
    ports:
      - "8000:8000"
    
    develop:
        watch:
           - action: sync
             path:  .
             target: /app
             ignore:
                 -  .venv/
                 -  .git/
                 -  .__pycache__/
                 -  .env
                 -  db.sqlite3

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

