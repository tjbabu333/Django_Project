{% extends "employees/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Employee List</h2>

    {% if perms.employees.add_employee %}
        <a href="{% url 'employee_create' %}"
           class="btn btn-success mb-3">
            Add Employee
        </a>
    {% endif %}

    <!-- Search Form -->
    <form id="searchForm" class="row g-2 mb-3">

        <div class="col-md-8">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by name, email, department..."
                autocomplete="off"
            >
        </div>

        <div class="col-md-2">
            <button type="submit"
                    class="btn btn-primary w-100">
                Search
            </button>
        </div>

        <div class="col-md-2">
            <button type="button"
                    id="clearButton"
                    class="btn btn-secondary w-100">
                Clear
            </button>
        </div>

    </form>

    <!-- Department Filter -->
    
    <div class="mb-3">

        <label for="departmentFilter"
               class="form-label">
            Filter by Department:
        </label>

        <select 
             id="departmentFilter"
             name="department"
             class="form-select"
        >
        

            <option value="">All Departments</option>
            
            {% for department in departments %}
                <option value="{{ department.id }}">
                    {{ department.name }}
                </option>
            {% endfor %}

        </select>
    </div>

    <!-- Search Status -->
    <div id="searchStatus"
         class="mb-2 text-muted"
         role="status"
         aria-live="polite">
    </div>

    <!-- Employee Table -->
    <div class="table-responsive">

        <table class="table table-striped table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody">
                <tr>
                    <td colspan="7">
                        Loading employees...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

    <!-- Pagination -->
    <div id="paginationContainer"
         class="d-flex align-items-center gap-3 mt-3"
         style="display: none !important;">

        <button type="button"
                id="previousButton"
                class="btn btn-outline-primary btn-sm">
            Previous
        </button>

        <span id="pageInfo"></span>

        <button type="button"
                id="nextButton"
                class="btn btn-outline-primary btn-sm">
            Next
        </button>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // HTML Elements
    const searchInput =
        document.getElementById("searchInput");

    const searchForm =
        document.getElementById("searchForm");

    const clearButton =
        document.getElementById("clearButton");

    const departmentFilter =
        document.getElementById("departmentFilter");

    const tableBody =
        document.getElementById("employeeTableBody");

    const searchStatus =
        document.getElementById("searchStatus");

    const paginationContainer =
        document.getElementById("paginationContainer");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const pageInfo =
        document.getElementById("pageInfo");

    // Permissions for button visibility only
    const canEdit =
        "{{ perms.employees.change_employee|yesno:'true,false' }}" === "true";

    const canDelete =
        "{{ perms.employees.delete_employee|yesno:'true,false' }}" === "true";

    // URLs generated by Django
    const detailUrlTemplate =
        "{% url 'employee_detail' 0 %}";

    const editUrlTemplate =
        "{% url 'employee_update' 0 %}";

    const deleteUrlTemplate =
        "{% url 'employee_delete' 0 %}";

    // Search state
    let debounceTimer;
    let controller = null;
    let searchSequence = 0;
    let currentPage = 1;

    // Display status text
    function setStatus(message) {
        searchStatus.textContent = message;
    }

    // Show one message inside the table
    function showTableMessage(message) {
        tableBody.replaceChildren();

        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 7;
        cell.textContent = message;

        row.appendChild(cell);
        tableBody.appendChild(row);
    }

    // Build URLs for existing employee records
    function employeeUrl(template, id) {
        return template.replace(
            "/0/",
            "/" + encodeURIComponent(id) + "/"
        );
    }

    // Create a safe text cell
    function createCell(value) {
        const cell = document.createElement("td");
        cell.textContent = value ?? "";
        return cell;
    }

    // Create an action link
    function createAction(label, url, style) {
        const link = document.createElement("a");

        link.href = url;
        link.textContent = label;
        link.className = "btn btn-sm " + style;
        link.style.marginRight = "5px";

        return link;
    }

    // Render employees in one table
    function renderEmployees(employees) {

        tableBody.replaceChildren();

        if (employees.length === 0) {
            showTableMessage("No employees found.");
            return;
        }

        employees.forEach(function (employee) {

            const row = document.createElement("tr");

            row.appendChild(createCell(employee.id));
            row.appendChild(createCell(employee.name));
            row.appendChild(createCell(employee.email));
            row.appendChild(createCell(employee.department));
            row.appendChild(createCell(employee.designation));
            row.appendChild(createCell(employee.salary));

            const actions = document.createElement("td");

            // View button
            actions.appendChild(
                createAction(
                    "View",
                    employeeUrl(
                        detailUrlTemplate,
                        employee.id
                    ),
                    "btn-primary"
                )
            );

            // Edit button
            if (canEdit) {
                actions.appendChild(
                    createAction(
                        "Edit",
                        employeeUrl(
                            editUrlTemplate,
                            employee.id
                        ),
                        "btn-warning"
                    )
                );
            }

            // Delete button
            if (canDelete) {
                actions.appendChild(
                    createAction(
                        "Delete",
                        employeeUrl(
                            deleteUrlTemplate,
                            employee.id
                        ),
                        "btn-danger"
                    )
                );
            }

            row.appendChild(actions);
            tableBody.appendChild(row);
        });
    }

    // Update pagination controls
    function renderPagination(data) {

        const totalPages = Number(data.num_pages || 1);
        const page = Number(data.page || 1);

        currentPage = page;

        pageInfo.textContent =
            "Page " + page + " of " + totalPages;

        previousButton.disabled = !data.has_previous;
        nextButton.disabled = !data.has_next;

        paginationContainer.style.setProperty(
            "display",
            "flex",
            "important"
        );
    }

    // Main AJAX search function
    async function searchEmployees(page = 1) {

        clearTimeout(debounceTimer);

        // Invalidate older searches
        const sequence = ++searchSequence;

        // Cancel previous AJAX request
        if (controller) {
            controller.abort();
        }

        controller = new AbortController();

        const signal = controller.signal;

        const query = searchInput.value.trim();
        const department = departmentFilter.value;

        // Build query parameters
        const params = new URLSearchParams();

        params.set("q", query);
        params.set("department", department);
        params.set("page", String(page));

        setStatus("Searching...");
        showTableMessage("Searching...");

        try {

            const response = await fetch(
                "/employees/search-api/?" + params.toString(),
                {
                    method: "GET",
                    signal: signal,
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP error: " + response.status
                );
            }

            const data = await response.json();

            // Ignore any stale response
            if (signal.aborted ||
                sequence !== searchSequence) {
                return;
            }

            if (!Array.isArray(data.employees)) {
                throw new Error(
                    "Invalid API response: employees list missing"
                );
            }

            renderEmployees(data.employees);
            renderPagination(data);

            setStatus(
                data.employees.length +
                " employee(s) on this page"
            );

        } catch (error) {

            if (error.name === "AbortError" ||
                sequence !== searchSequence) {
                return;
            }

            console.error(
                "Employee search failed:",
                error
            );

            setStatus("Unable to load employees.");
            showTableMessage(
                "Something went wrong. Please try again."
            );

            paginationContainer.style.setProperty(
                "display",
                "none",
                "important"
            );
        }
    }

    // Debounced live search
    searchInput.addEventListener("input", function () {

        clearTimeout(debounceTimer);

        // Stop current request immediately
        if (controller) {
            controller.abort();
        }

        ++searchSequence;

        debounceTimer = setTimeout(function () {
            searchEmployees(1);
        }, 300);
    });

    // Search button
    searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        searchEmployees(1);
    });

    // Department dropdown
    departmentFilter.addEventListener("change", function () {
        searchEmployees(1);
    });

    // Clear button
    clearButton.addEventListener("click", function () {
        searchInput.value = "";
        departmentFilter.value = "";
        searchEmployees(1);
    });

    // Previous page
    previousButton.addEventListener("click", function () {
        if (currentPage > 1) {
            searchEmployees(currentPage - 1);
        }
    });

    // Next page
    nextButton.addEventListener("click", function () {
        if (!nextButton.disabled) {
            searchEmployees(currentPage + 1);
        }
    });

    // Load employees automatically
    searchEmployees(1);

});
</script>

{% endblock %}
